<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot-n-Video Section</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .bot-n-video-section {
      padding: 30px 0;
    }
    .bot-n-video {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
    }
    .bot-n-video img {
      width: 100%;
      height: auto;
      display: block;
    }
    .bot-n-video::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }
    .bot-n-video:hover::after {
      background: rgba(0,0,0,0.2);
    }
    .bot-n-video .play-btn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #b30000;
      width: 60px; height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .bot-n-video .play-btn::before {
      content: "";
      display: block;
      width: 0; height: 0;
      border-left: 20px solid #fff;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <div class="container bot-n-video-section">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="bot-n-video">
          <img src="./assets/img/estate-bot-dubai.png" alt="Video Thumbnail">
          <div class="play-btn"></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="bot-n-video">
          <img src="./assets/img/estate-bot-dubai.png" alt="Video Thumbnail">
          <div class="play-btn"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

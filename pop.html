<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot-N-Modal Wizard</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .bot-N-model .modal-content {
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      border: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* Global Close Button */
    .bot-N-model .btn-close.global-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.3rem;
      opacity: 0.7;
      z-index: 5;
    }

    .bot-N-model .btn-close:hover {
      opacity: 1;
    }

    /* Step-specific Close Button */
    .step .btn-close.step-close {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .progress-steps {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      margin-top: 1.4rem;

    }

    .progress-steps .step-circle {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #555;
      font-weight: 600;
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .progress-steps .step-circle.completed {
      background: #28a745;
      border-color: #28a745;
      color: #fff;
    }

    .progress-steps .step-circle.active {
      border-color: #e60000;
      color: #e60000;
    }

    .progress-steps .line {
      flex: 1;
      height: 2px;
      background: #ccc;
      margin: 0 10px;
      z-index: 1;
      min-width: 20px;
    }

    .progress-steps .line.active {
      background: #e60000;
    }

    .bot-N-model .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    @media(max-width: 576px) {
      .bot-N-model .options {
        grid-template-columns: 1fr;
      }
    }

    .bot-N-model .option-btn {
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    .bot-N-model .option-btn:hover,
    .bot-N-model .option-btn.active {
      border-color: #e60000;
      background: #ffe6e6;
      color: #e60000;
      font-weight: 600;
    }

    .bot-N-model .modal-footer {
      justify-content: space-between;
      border-top: none;
      flex-wrap: wrap;
    }

    .bot-N-model .btn-back {
      background: #ddd;
      border-radius: 10px;
      padding: 8px 20px;
      font-weight: 600;
      border: none;
    }

    .bot-N-model .btn-next {
      background: #e60000;
      color: #fff;
      border-radius: 10px;
      padding: 8px 20px;
      font-weight: 600;
      border: none;
    }

    .step {
      display: none;
      position: relative;
    }

    .step.active {
      display: block;
    }

    .is-invalid {
      border-color: #e60000 !important;
      animation: shake 0.3s ease-in-out;
    }

    .error-text {
      color: #e60000;
      font-size: 0.85rem;
      text-align: left;
      margin-top: 4px;
    }

    .nk-bot-pop-text:focus {
      border-radius: 10px;
      border: 2px solid #e60000;
      padding: 10px;
      transition: border-color 0.3s ease-in-out;
      box-shadow: 0 0 5px rgba(230, 0, 0, 0.5);
    }

    .close-btn-bot {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      font-size: 14px;
      padding: 10px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
.close-btn-bot:focus{
      box-shadow: 0 0 8px rgba(230, 0, 0, 0.6);
    }
    @keyframes shake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-3px);
      }

      50% {
        transform: translateX(3px);
      }

      75% {
        transform: translateX(-3px);
      }

      100% {
        transform: translateX(0);
      }
    }
  </style>
</head>

<body class="p-5">
  <div id="main-content">
    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#botNModal">
      Get a Free Quote
    </button>
  </div>

  <!-- Modal -->
  <div class="modal fade bot-N-model" id="botNModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <!-- Global Close Button -->
        <button type="button" class="btn-close global-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <button type="button" class="btn-close step-close close-btn-bot" data-bs-dismiss="modal"></button>

        <!-- Progress Steps -->
        <div class="progress-steps">
          <div class="step-circle active">1</div>
          <div class="line"></div>
          <div class="step-circle">2</div>
          <div class="line"></div>
          <div class="step-circle">3</div>
        </div>

        <!-- Step 1 -->
        <div class="modal-body step step-1 active">
          <h5>What do you need?</h5>
          <div class="options">
            <label class="option-btn"><input type="checkbox" class="d-none required-field"> Digital Marketing</label>
            <label class="option-btn"><input type="checkbox" class="d-none required-field"> Product Shoot</label>
            <label class="option-btn"><input type="checkbox" class="d-none required-field"> Drone Videography</label>
            <label class="option-btn"><input type="checkbox" class="d-none required-field"> Website Development</label>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="modal-body step step-2">
          <h5>Tell us about your goals.</h5>
          <p>WE’RE ALWAYS UP FOR A CHALLENGE</p>
          <textarea class="form-control required-field nk-bot-pop-text" rows="4" placeholder="Type here..."
            required></textarea>
        </div>

        <!-- Step 3 -->
        <div class="modal-body step step-3">
          <h5 style="color:#e60000; font-weight:700;">Tell Us about you.</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control required-field nk-bot-pop-text" placeholder="First Name*"
                data-type="name" required>
              <div class="error-text d-none">Please enter a valid first name (letters only).</div>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control required-field nk-bot-pop-text" placeholder="Last Name*"
                data-type="name" required>
              <div class="error-text d-none">Please enter a valid last name (letters only).</div>
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control required-field nk-bot-pop-text" placeholder="Business Email*"
                data-type="email" required>
              <div class="error-text d-none">Enter a valid email (e.g. test@example.com).</div>
            </div>
            <div class="col-md-6">
              <input type="tel" class="form-control required-field nk-bot-pop-text" placeholder="Phone Number*"
                data-type="phone" required>
              <div class="error-text d-none">Enter a valid phone number (10+ digits).</div>
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="modal-footer">
          <button class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back</button>
          <button class="btn-next">Next <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- pop sreet -->
  <script>
    // Checkbox toggle for Step 1
    document.querySelectorAll(".option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const checkbox = btn.querySelector("input[type=checkbox]");
        checkbox.checked = !checkbox.checked;
        btn.classList.toggle("active", checkbox.checked);
      });
    });

    let currentStep = 1;
    const steps = document.querySelectorAll(".step");
    const nextBtn = document.querySelector(".btn-next");
    const backBtn = document.querySelector(".btn-back");
    const circles = document.querySelectorAll(".step-circle");
    const lines = document.querySelectorAll(".line");

    function updateProgress(step) {
      circles.forEach((circle, i) => {
        circle.classList.remove("completed", "active");
        if (i < step - 1) {
          circle.classList.add("completed");
          circle.innerHTML = "<i class='fa fa-check'></i>";
        } else if (i === step - 1) {
          circle.classList.add("active");
          circle.innerHTML = i + 1;
        } else {
          circle.innerHTML = i + 1;
        }
      });
      lines.forEach((line, i) => {
        line.classList.toggle("active", i < step - 1);
      });
    }

    function showStep(step) {
      steps.forEach((s, i) => {
        s.classList.toggle("active", i === step - 1);
      });

      backBtn.style.display = step === 1 ? "none" : "inline-block";
      nextBtn.innerHTML = step === steps.length
        ? "Submit <i class='fa-solid fa-check'></i>"
        : "Next <i class='fa-solid fa-arrow-right'></i>";

      updateProgress(step);
    }

    function validateStep(step) {
      let valid = true;
      const current = steps[step - 1];
      const inputs = current.querySelectorAll(".required-field");

      // Step 1 special check: at least one checkbox
      if (step === 1) {
        const checked = current.querySelectorAll("input[type=checkbox]:checked").length;
        if (checked === 0) {
          valid = false;
          current.querySelectorAll(".option-btn").forEach(opt => {
            opt.classList.add("is-invalid");
          });
        } else {
          current.querySelectorAll(".option-btn").forEach(opt => {
            opt.classList.remove("is-invalid");
          });
        }
      }

      inputs.forEach(input => {
        const errorText = input.parentElement.querySelector(".error-text");
        if (input.type !== "checkbox") {
          let value = input.value.trim();
          let type = input.dataset.type;

          if (!value) {
            input.classList.add("is-invalid");
            if (errorText) errorText.classList.remove("d-none");
            valid = false;
          } else if (type === "name" && !/^[A-Za-z\s]+$/.test(value)) {
            input.classList.add("is-invalid");
            if (errorText) errorText.classList.remove("d-none");
            valid = false;
          } else if (type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
            input.classList.add("is-invalid");
            if (errorText) errorText.classList.remove("d-none");
            valid = false;
          } else if (type === "phone" && !/^\d{10,}$/.test(value)) {
            input.classList.add("is-invalid");
            if (errorText) errorText.classList.remove("d-none");
            valid = false;
          } else {
            input.classList.remove("is-invalid");
            if (errorText) errorText.classList.add("d-none");
          }
        }
      });

      return valid;
    }

    // Remove red border on focus
    document.querySelectorAll("input, textarea").forEach(el => {
      el.addEventListener("focus", () => {
        el.classList.remove("is-invalid");
        const errorText = el.parentElement.querySelector(".error-text");
        if (errorText) errorText.classList.add("d-none");
      });
    });

    // Remove red border if checkbox selected
    document.querySelectorAll(".option-btn input[type=checkbox]").forEach(chk => {
      chk.addEventListener("change", () => {
        chk.closest(".option-btn").classList.remove("is-invalid");
      });
    });

    nextBtn.addEventListener("click", () => {
      if (!validateStep(currentStep)) return;

      if (currentStep < steps.length) {
        currentStep++;
        showStep(currentStep);
      } else {
        const modal = bootstrap.Modal.getInstance(document.getElementById('botNModal'));
        modal.hide();
        window.location.href = "thanku.html"; // redirect
      }
    });

    backBtn.addEventListener("click", () => {
      if (currentStep > 1) {
        currentStep--;
        showStep(currentStep);
      }
    });

    showStep(currentStep);
  </script>
  <!--pop scrept end  -->
</body>

</html>
